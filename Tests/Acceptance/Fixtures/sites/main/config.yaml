base: 'http://%env(DDEV_HOSTNAME)%/'
rootPageId: 1
websiteTitle: 'OAuth2 Client'
dependencies:
  - typo3/fluid-styled-content
  - typo3/felogin
enabled_oauth2_providers: 'mock,mock-fe'
oauth2_storage_pid: 2
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
